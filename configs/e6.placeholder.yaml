project:
  seed: 20260812
  e1_root: __SET_ME_E1_GENERATED_ROOT__
  output_root: __SET_ME_E6_OUTPUT_ROOT__

model:
  model_path: __SET_ME_WHISPER_MODEL_PATH__
  device: cuda
  dtype: float16
  language: en
  task: transcribe
  max_new_tokens: 180

selection:
  snr_db: -10.0
  lyric_receiver_scs_min: 0.33
  speech_receiver_scs_max: -0.8
  pairs_per_track: 1

patching:
  encoder_frames_per_second: 50
  real_frames: 500
  layers: [0, 4, 8, 12, 16, 20, 24, 28, 31]
  windows:
    onset: [0, 100]
    middle: [200, 300]
    offset: [400, 500]
  self_control_layer: 16
  min_stable_full_patch_scs_effect: 0.10

scoring:
  lowercase: true
  strip_punctuation: true
  bootstrap_replicates: 10000
