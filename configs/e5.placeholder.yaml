project:
  seed: 20260812
  split: development
  pairs_manifest: __SET_ME_SHARED_PAIRS_MANIFEST__
  output_root: __SET_ME_E5_OUTPUT_ROOT__

model:
  model_path: __SET_ME_WHISPER_MODEL_PATH__
  device: cuda
  dtype: float16
  language: en
  task: transcribe
  max_new_tokens: 180

audio:
  sample_rate: 16000
  clip_duration_s: 10.0
  snr_db: -10.0
